<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Trampoline Stars</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#8fd3ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  canvas{display:block;width:100vw;height:100vh;touch-action:none}
  #score{position:fixed;top:14px;left:18px;font-size:30px;font-weight:800;color:#fff;text-shadow:0 2px 5px rgba(0,0,0,.35);pointer-events:none}
  #hint{position:fixed;top:14px;left:0;right:0;text-align:center;font-size:22px;font-weight:700;color:#1d3b5a;text-shadow:0 1px 3px rgba(255,255,255,.6);pointer-events:none}
  #bar{position:fixed;left:0;right:0;bottom:14px;display:flex;justify-content:center;pointer-events:none}
  #bar button{pointer-events:auto;font:700 22px system-ui,-apple-system,"Segoe UI",sans-serif;padding:12px 20px;border:0;border-radius:18px;background:#fff;color:#1d3b2a;box-shadow:0 4px 0 rgba(0,0,0,.2);cursor:pointer}
  #bar button:active{transform:translateY(2px)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="score">Stars: 0</div>
<div id="hint">Drag to move. Tap as you come down for a SUPER bounce!</div>
<div id="bar"><button id="mute">Sound: On</button></div>
<script>
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
let W, H, R, SR, G, yT, BV, SV, x, y, vy = 0, squash = 0, dragging = false, px = 0, py = 0;
let stars = [], count = 0, spawnT = 0.5, msg = '', msgT = 0, parts = [], ac = null, muted = false;

function resize() {
  const d = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * d; cv.height = H * d;
  ctx.setTransform(d, 0, 0, d, 0, 0);
  R = Math.min(W, H) * 0.05;
  SR = R * 0.7;
  G = H * 2.4;
  yT = H * 0.78;
  BV = Math.sqrt(2 * G * H * 0.3);
  SV = Math.sqrt(2 * G * H * 0.6);
  if (x === undefined) { x = W / 2; y = yT - R - H * 0.3; }
}
addEventListener('resize', resize);

function tone(f, d, type = 'sine', v = 0.25) {
  if (!ac || muted) return;
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * 1.4, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d + 0.02);
}

function sparkle(px0, py0, col) {
  for (let k = 0; k < 14; k++) parts.push({ x: px0, y: py0, vx: (Math.random() - 0.5) * 340, vy: (Math.random() - 0.5) * 340 - 120, life: 0.6, col });
}

function update(dt) {
  const floor = yT - R;
  if (dragging) {
    const tx = Math.min(Math.max(px, W * 0.2 + R), W * 0.8 - R);
    x += (tx - x) * Math.min(1, dt * 10);
  }
  vy += G * dt; y += vy * dt;
  if (y >= floor && vy > 0) { y = floor; vy = -BV; squash = 1; tone(330, 0.12, 'sine', 0.2); }
  squash = Math.max(0, squash - dt * 4);
  msgT = Math.max(0, msgT - dt);

  spawnT -= dt;
  if (spawnT <= 0 && stars.length < 6) {
    spawnT = 1.1;
    stars.push({ x: W * (0.1 + 0.8 * Math.random()), y: H * (0.08 + 0.4 * Math.random()), age: 0 });
  }
  for (let i = stars.length - 1; i >= 0; i--) {
    const s = stars[i]; s.age += dt;
    if (Math.hypot(s.x - x, s.y - y) < R + SR) {
      count++; $('score').textContent = 'Stars: ' + count;
      sparkle(s.x, s.y, '#ffd23f'); tone(990, 0.2, 'triangle', 0.25);
      stars.splice(i, 1);
    } else if (s.age > 8) stars.splice(i, 1);
  }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life -= dt; p.vy += 500 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.life <= 0) parts.splice(i, 1);
  }
}

function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, yT);
  g.addColorStop(0, '#8fd3ff'); g.addColorStop(1, '#e8f9ff');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff6b0';
  ctx.beginPath(); ctx.arc(W * 0.85, H * 0.15, Math.min(W, H) * 0.06, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#6cc66a'; ctx.fillRect(0, yT + H * 0.12, W, H);
}

function drawMat() {
  const L = W * 0.2, Rr = W * 0.8, ground = yT + H * 0.12;
  ctx.strokeStyle = '#455a64'; ctx.lineWidth = Math.max(4, W * 0.006); ctx.lineCap = 'round';
  for (const lx of [L + 24, Rr - 24]) { ctx.beginPath(); ctx.moveTo(lx, yT + H * 0.03); ctx.lineTo(lx, ground); ctx.stroke(); }
  ctx.strokeStyle = '#90a4ae'; ctx.lineWidth = 3;
  for (let sx = L; sx <= Rr; sx += 22) { ctx.beginPath(); ctx.moveTo(sx, yT + H * 0.012); ctx.lineTo(sx, yT + H * 0.03); ctx.stroke(); }
  ctx.fillStyle = '#ef5350'; ctx.fillRect(L - 8, yT - H * 0.005, Rr - L + 16, H * 0.02);
  ctx.fillStyle = '#2e3d8f'; ctx.fillRect(L, yT - H * 0.003, Rr - L, H * 0.012);
}

function drawKid() {
  const rx = R * (1 + squash * 0.25), ry = R * (1 - squash * 0.2);
  ctx.fillStyle = '#ffcc9e'; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#6d4c41'; ctx.beginPath(); ctx.ellipse(x, y - ry * 0.25, rx * 1.02, ry * 0.8, 0, Math.PI, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#2b2b2b';
  for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(x + s * rx * 0.35, y + ry * 0.05, rx * 0.09, 0, Math.PI * 2); ctx.fill(); }
  ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = Math.max(2, R * 0.08);
  ctx.beginPath(); ctx.arc(x, y + ry * 0.15, rx * 0.35, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
}

function drawStar(s) {
  const p = Math.min(1, (8 - s.age) / 1.5);
  ctx.globalAlpha = p;
  ctx.fillStyle = '#ffd23f'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? SR * 0.45 : SR;
    ctx.lineTo(s.x + Math.cos(a) * r, s.y + Math.sin(a) * r);
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.globalAlpha = 1;
}

function draw() {
  drawSky();
  drawMat();
  for (const s of stars) drawStar(s);
  drawKid();
  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, p.life * 2); ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, 6, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (msgT > 0) {
    ctx.globalAlpha = Math.min(1, msgT * 2);
    ctx.fillStyle = '#e53935'; ctx.font = '800 40px system-ui,-apple-system,"Segoe UI",sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(msg, W / 2, H * 0.3);
    ctx.globalAlpha = 1;
  }
}

cv.addEventListener('pointerdown', e => {
  if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
  if (ac.state === 'suspended') ac.resume();
  dragging = true; px = e.clientX; py = e.clientY;
  if (vy >= 0 && y > yT - R - H * 0.12) {
    vy = -SV; squash = 1; msg = 'SUPER BOUNCE!'; msgT = 0.9;
    tone(660, 0.2, 'triangle', 0.3); sparkle(x, yT, '#ffd23f');
  }
});
cv.addEventListener('pointermove', e => { if (dragging) { px = e.clientX; py = e.clientY; } });
addEventListener('pointerup', () => dragging = false);
addEventListener('pointercancel', () => dragging = false);

$('mute').onclick = () => { muted = !muted; $('mute').textContent = 'Sound: ' + (muted ? 'Off' : 'On'); };

resize();
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
