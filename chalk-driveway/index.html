<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Chalk Driveway</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#8e949c;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  canvas{display:block;width:100vw;height:100vh;touch-action:none}
  #hint{position:fixed;top:14px;left:0;right:0;text-align:center;font-size:24px;font-weight:700;color:#fff;text-shadow:0 2px 5px rgba(0,0,0,.45);pointer-events:none}
  #bar{position:fixed;left:0;right:0;bottom:14px;display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding:0 10px;pointer-events:none}
  #bar button{pointer-events:auto;font:700 22px system-ui,-apple-system,"Segoe UI",sans-serif;padding:12px 16px;border:0;border-radius:18px;background:#fff;color:#1d3b2a;box-shadow:0 4px 0 rgba(0,0,0,.2);cursor:pointer}
  #bar button.on{outline:4px solid #ffd23f}
  #bar button:active{transform:translateY(2px)}
  #bar .sw{width:44px;padding:12px 0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">Draw with chalk, or pick a stamp</div>
<div id="bar">
  <button class="sw on" data-c="#ff5c5c" style="background:#ff5c5c">&nbsp;</button>
  <button class="sw" data-c="#5cb8ff" style="background:#5cb8ff">&nbsp;</button>
  <button class="sw" data-c="#ffe066" style="background:#ffe066">&nbsp;</button>
  <button class="sw" data-c="#7ee07a" style="background:#7ee07a">&nbsp;</button>
  <button class="sw" data-c="#ff8fd8" style="background:#ff8fd8">&nbsp;</button>
  <button class="sw" data-c="#ffffff" style="background:#ffffff">&nbsp;</button>
  <button data-s="star">Star</button>
  <button data-s="heart">Heart</button>
  <button data-s="sun">Sun</button>
  <button id="clear">Erase all</button>
  <button id="mute">Sound: On</button>
</div>
<script>
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
let W, H, S, speck = [], strokes = [], cur = null, stamps = [];
let mode = 'draw', color = '#ff5c5c', stampType = 'star', ghostX = -999, ghostY = -999, ac = null, muted = false;

function resize() {
  const d = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * d; cv.height = H * d;
  ctx.setTransform(d, 0, 0, d, 0, 0);
  S = Math.min(W, H) * 0.06;
  speck = Array.from({ length: Math.round(W * H / 400) }, () => [Math.random() * W, Math.random() * H, Math.random() < 0.5]);
}
addEventListener('resize', resize);

function tone(f, d, type = 'sine', v = 0.25) {
  if (!ac || muted) return;
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * 1.4, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d + 0.02);
}

function starPath(s) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? s * 0.45 : s;
    ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  ctx.closePath();
}

function heartPath(s) {
  ctx.beginPath();
  ctx.moveTo(0, s * 0.9);
  ctx.bezierCurveTo(-s * 1.2, s * 0.2, -s * 0.9, -s * 0.9, 0, -s * 0.4);
  ctx.bezierCurveTo(s * 0.9, -s * 0.9, s * 1.2, s * 0.2, 0, s * 0.9);
  ctx.closePath();
}

function drawStamp(type, x, y, c, alpha) {
  ctx.save(); ctx.translate(x, y); ctx.globalAlpha = alpha;
  ctx.fillStyle = c; ctx.strokeStyle = c; ctx.lineCap = 'round'; ctx.lineWidth = Math.max(6, S * 0.14);
  if (type === 'heart') { heartPath(S); ctx.fill(); }
  else if (type === 'star') { starPath(S); ctx.fill(); }
  else {
    ctx.beginPath(); ctx.arc(0, 0, S * 0.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4;
      ctx.moveTo(Math.cos(a) * S * 0.7, Math.sin(a) * S * 0.7);
      ctx.lineTo(Math.cos(a) * S * 1.0, Math.sin(a) * S * 1.0);
    }
    ctx.stroke();
  }
  ctx.restore();
}

function drawBg() {
  ctx.fillStyle = '#8e949c'; ctx.fillRect(0, 0, W, H);
  for (const [x, y, dark] of speck) { ctx.fillStyle = dark ? '#7d838b' : '#a2a8b0'; ctx.fillRect(x, y, 2, 2); }
  ctx.strokeStyle = '#7b8290'; ctx.lineWidth = 3;
  for (const f of [0.33, 0.66]) { ctx.beginPath(); ctx.moveTo(0, H * f); ctx.lineTo(W, H * f); ctx.stroke(); }
}

function drawStrokes() {
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const s of strokes) {
    if (s.pts.length === 1) { ctx.fillStyle = s.c; ctx.beginPath(); ctx.arc(s.pts[0].x, s.pts[0].y, 7, 0, Math.PI * 2); ctx.fill(); continue; }
    ctx.globalAlpha = 0.85; ctx.strokeStyle = s.c; ctx.lineWidth = 14;
    ctx.beginPath(); s.pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.stroke();
    ctx.globalAlpha = 0.35; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4;
    ctx.beginPath(); s.pts.forEach((p, i) => i ? ctx.lineTo(p.x + 1.5, p.y - 1.5) : ctx.moveTo(p.x + 1.5, p.y - 1.5)); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

cv.addEventListener('pointerdown', e => {
  if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
  if (ac.state === 'suspended') ac.resume();
  if (mode === 'stamp') {
    stamps.push({ type: stampType, x: e.clientX, y: e.clientY, c: color });
    if (stamps.length > 300) stamps.shift();
    tone(520, 0.15, 'triangle', 0.25);
  } else {
    cur = { c: color, pts: [{ x: e.clientX, y: e.clientY }] };
    strokes.push(cur);
    if (strokes.length > 300) strokes.shift();
  }
});
cv.addEventListener('pointermove', e => {
  ghostX = e.clientX; ghostY = e.clientY;
  if (cur && Math.hypot(e.clientX - cur.pts[cur.pts.length - 1].x, e.clientY - cur.pts[cur.pts.length - 1].y) > 2) {
    cur.pts.push({ x: e.clientX, y: e.clientY });
  }
});
cv.addEventListener('pointerleave', () => { ghostX = -999; ghostY = -999; });
addEventListener('pointerup', () => cur = null);
addEventListener('pointercancel', () => cur = null);

document.querySelectorAll('[data-c]').forEach(b => b.onclick = () => {
  mode = 'draw'; color = b.dataset.c;
  document.querySelectorAll('[data-c],[data-s]').forEach(x => x.classList.toggle('on', x === b));
});
document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => {
  mode = 'stamp'; stampType = b.dataset.s;
  document.querySelectorAll('[data-c],[data-s]').forEach(x => x.classList.toggle('on', x === b));
});
$('clear').onclick = () => { strokes = []; stamps = []; };
$('mute').onclick = () => { muted = !muted; $('mute').textContent = 'Sound: ' + (muted ? 'Off' : 'On'); };

function frame() {
  drawBg();
  drawStrokes();
  for (const st of stamps) drawStamp(st.type, st.x, st.y, st.c, 1);
  if (mode === 'stamp' && ghostX > -900) drawStamp(stampType, ghostX, ghostY, color, 0.35);
  requestAnimationFrame(frame);
}

resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
